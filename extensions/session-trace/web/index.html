<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>session-trace — flow graph of pi sessions</title>
<style>
	:root {
		--bg: #101216; --panel: #151a21; --line: #2a3038;
		--text: #d7dde6; --dim: #7d8590; --muted: #9aa4b2;
		--accent: #e3b341; --ok: #3fb950; --err: #f85149; --warn: #d29922;
		--tool: #58c4dc; --user: #a5d6ff;
		--mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0; background: var(--bg); color: var(--text);
		font: 13px/1.5 var(--mono);
		display: flex; flex-direction: column;
	}
	header {
		display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
		padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
	}
	header .logo { font-weight: 700; }
	header .logo b { color: var(--accent); }
	#file { color: var(--muted); }
	#stats { color: var(--text); }
	.dim { color: var(--dim); }
	.controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
	button, select {
		font: inherit; color: var(--text); background: #1d242e; border: 1px solid var(--line);
		border-radius: 6px; padding: 4px 12px; cursor: pointer;
	}
	button:hover, select:hover { border-color: var(--dim); }
	#play { width: 40px; text-align: center; }
	#errs.on { color: var(--err); border-color: var(--err); }
	#q {
		font: inherit; color: var(--text); background: #1d242e; border: 1px solid var(--line);
		border-radius: 6px; padding: 4px 10px; width: 150px;
	}
	#q:focus { outline: none; border-color: var(--accent); }
	input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--accent); }
	#pos { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
	label.btn {
		font: inherit; color: var(--text); background: #1d242e; border: 1px solid var(--line);
		border-radius: 6px; padding: 4px 12px; cursor: pointer;
	}
	label.btn:hover { border-color: var(--dim); }
	input[type="file"] { display: none; }

	#split { flex: 1; display: flex; min-height: 0; }
	#viz {
		position: relative;
		flex: 0 0 60%;
		display: flex; flex-direction: column; min-height: 0;
		border-right: 1px solid var(--line); background: var(--panel);
	}
	#viz canvas { display: block; width: 100%; cursor: pointer; }
	#zoomind {
		position: absolute; top: 8px; right: 12px; z-index: 5;
		color: var(--dim); font-size: 11px; pointer-events: none;
		font-variant-numeric: tabular-nums;
	}
	#graph { flex: 1 1 auto; min-height: 140px; }
	#strip { flex: 0 0 26px; border-top: 1px solid var(--line); }
	#timeline {
		flex: 1; overflow-y: auto; padding: 14px 24px 40px;
		min-width: 0;
	}
	@media (max-width: 880px) {
		#split { flex-direction: column; }
		#viz { flex: 0 0 240px; border-right: none; border-bottom: 1px solid var(--line); }
	}
	.user { margin: 10px 0 4px; color: var(--user); }
	.user .dot { color: var(--accent); }
	.marker { margin: 4px 0 4px 2px; color: var(--dim); }
	.marker .i { color: var(--muted); }
	.marker.bash { color: var(--muted); }
	.marker.bash .i { color: var(--warn); }
	.card {
		position: relative; margin: 6px 0 6px 14px; padding: 6px 12px;
		background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
	}
	.card::before {
		content: ""; position: absolute; left: -14px; top: -6px; bottom: 100%;
		width: 1px; background: var(--line);
	}
	.card.flash { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
	.card.live { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
	.card .t { color: var(--dim); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
	.card .model { color: var(--muted); }
	.chip {
		display: flex; gap: 8px; align-items: baseline; padding: 1px 0;
		font-variant-numeric: tabular-nums;
	}
	.chip .tool { color: var(--tool); min-width: 96px; }
	.chip .arg { color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.chip .dur { color: var(--muted); }
	.st { min-width: 14px; text-align: right; }
	.st.ok { color: var(--ok); }
	.st.err { color: var(--err); }
	.st.run { color: var(--accent); animation: spin 0.9s linear infinite; display: inline-block; }
	@keyframes spin { to { transform: rotate(360deg); } }
	.prev { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); color: var(--muted); }
	.prev.text { color: var(--text); }
	.errline { color: var(--err); }
	.warn { color: var(--warn); }
	.err { color: var(--err); }

	#wbtn.on { color: var(--ok); border-color: var(--ok); }
	#wpanel {
		position: fixed; top: 52px; right: 16px; z-index: 20;
		min-width: 340px; max-width: 500px; max-height: 60vh; overflow-y: auto;
		background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
		padding: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
	}
	#wpanel .w { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
	#wpanel .w:hover { background: #1d242e; }
	#wpanel .w .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
	#wpanel .w .dot { color: var(--ok); }
	#wpanel .w .task { color: var(--dim); margin-top: 2px; }
	#wpanel .empty { color: var(--dim); padding: 6px 8px; }
	.hidden { display: none; }
	#drop {
		position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
		background: color-mix(in srgb, var(--bg) 80%, transparent);
		color: var(--accent); font-size: 18px; z-index: 10;
	}
	#drop.drag { display: flex; }
	#empty { color: var(--dim); text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
	<div id="wpanel" class="hidden"></div>
	<div id="drop">отпустите файл сессии (.jsonl)</div>
	<header>
		<span class="logo"><b>◐</b> session-trace</span>
		<span id="file" class="dim">перетащите .jsonl сюда или</span>
		<label class="btn">выбрать файл<input type="file" id="pick" accept=".jsonl,.json"></label>
		<span id="stats"></span>
		<div class="controls">
			<button id="play" title="play/pause (space)">▶</button>
			<select id="speed" title="скорость">
				<option value="0.5">0.5×</option>
				<option value="1">1×</option>
				<option value="2">2×</option>
				<option value="8" selected>8×</option>
				<option value="32">32×</option>
				<option value="128">128×</option>
			</select>
			<input type="range" id="slider" min="0" max="1000" value="0">
			<span id="pos">--:--:--</span>
			<button id="toend" title="в конец">⏭</button>
			<button id="wbtn" class="hidden" title="живые task_batch-воркеры (клик — панель)">● 0</button>
			<input id="q" type="search" placeholder="фильтр…" spellcheck="false">
			<button id="errs" title="только ошибки">⚠</button>
		</div>
	</header>
	<main id="split">
		<section id="viz">
			<div id="zoomind">100%</div>
		<canvas id="graph"></canvas>
			<canvas id="strip"></canvas>
		</section>
		<section id="timeline"><div id="empty">read-only вьюер JSONL-сессий pi · файлы никуда не отправляются</div></section>
	</main>
	<script src="app.js"></script>
</body>
</html>
